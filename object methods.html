<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let user={
            name:"keshav",
            age: 20,
            city:"bengaluru"
        }
        console.log(Object.keys(user)); // returns an array of keys in the object
        console.log(Object.values(user)); // returns an array of values in the object
        console.log(Object.entries(user)); // returns an array of key-value pairs in the object
    </script>
</body>
</html>
