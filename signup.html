<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center><h1>Sign Up</h1></center>
    <center>
        <input type="text" placeholder="enter username" id="a"><br>
        <input type="text" placeholder="enter email" id="b"><br>
        <input type="text" placeholder="enter password" id="c"><br>
        <button onclick="signup()" style="background-color: brown;">Sign Up</button>
    </center>



    <script>
         function signup(){
            let username=document.getElementById("a").value;
            let email=document.getElementById("b").value;
            let password=document.getElementById("c").value;

            localStorage.setItem("username",username);
            localStorage.setItem("email",email);
            localStorage.setItem("password",password);
            alert("Sign Up Successful");
            window.location.href="login page.html";
         }
    </script>
</body>
</html>
